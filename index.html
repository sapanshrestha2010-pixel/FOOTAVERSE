<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOOTVERSE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #080b12;
      color: white;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      text-align: center;
      margin-top: 45px;
      margin-bottom: 10px;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #8f98a8;
      margin-bottom: 45px;
      font-size: 15px;
    }

    .card {
      background: #111722;
      border: 1px solid #202938;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .card p {
      color: #8f98a8;
      font-size: 14px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #1769ff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary {
      background: #202938;
    }

    .bottom {
      margin-top: auto;
      padding-top: 35px;
      display: flex;
      justify-content: space-around;
      color: #8f98a8;
      font-size: 13px;
    }

    .bottom div {
      text-align: center;
    }

    .icon {
      font-size: 24px;
      margin-bottom: 5px;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      color: #55a2ff;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">FOOTVERSE</div>

    <div class="subtitle">
      Build your team. Make the moves. Rule the game.
    </div>

    <div class="card">
      <h2>⚽ Spiel erstellen</h2>
      <p>Erstelle dein eigenes Fußball-Manager-Spiel.</p>
      <button onclick="createGame()">Spiel erstellen</button>
    </div>

    <div class="card">
      <h2>🎮 Spiel beitreten</h2>
      <p>Trete einem bestehenden Spiel mit einem Code bei.</p>
      <button class="secondary" onclick="joinGame()">Spiel beitreten</button>
    </div>

    <div id="message"></div>

    <div class="bottom">
      <div>
        <div class="icon">🏆</div>
        <div>Leaderboard</div>
      </div>

      <div>
        <div class="icon">👥</div>
        <div>Freunde</div>
      </div>

      <div>
        <div class="icon">⚙️</div>
        <div>Einstellungen</div>
      </div>
    </div>

  </div>

  <script>
    function createGame() {
      document.getElementById("message").innerText =
        "Spiel erstellen kommt als Nächstes 🚀";
    }

    function joinGame() {
      document.getElementById("message").innerText =
        "Spiel beitreten kommt als Nächstes 🎮";
    }
  </script>

</body>
</html>
